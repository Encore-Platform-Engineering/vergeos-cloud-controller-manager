name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/encore-platform-engineering/vergeos-cloud-controller-manager

jobs:
  check:
    name: Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # cloudx-io/setup-go has no go-version-file; derive the version from go.mod.
      - id: gover
        run: echo "version=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@8b45cf394acf101459db0d47aa9735a4fe5eea63 # v1
        with:
          go-version: ${{ steps.gover.outputs.version }}
          cache-key-prefix: check
      - run: go vet ./...
      # REQUIRE_HELM makes the chart tests fail (not skip) if helm is missing.
      - run: go test -race ./...
        env:
          REQUIRE_HELM: "1"
      - name: Helm lint
        run: |
          helm lint charts/vergeos-cloud-controller-manager \
            --set vergeos.host=https://vergeos.example --set vergeos.apiKey=x \
            --set loadBalancer.networkID=5 --set 'loadBalancer.ipPool={10.0.0.1}'
      - name: Helm template (LB on / LB off / private CA)
        run: |
          chart=charts/vergeos-cloud-controller-manager
          common="--set vergeos.host=https://vergeos.example --set vergeos.apiKey=x"
          helm template rel $chart $common --set loadBalancer.enabled=true --set loadBalancer.networkID=5 --set 'loadBalancer.ipPool={10.0.0.1}' >/dev/null
          helm template rel $chart $common --set loadBalancer.enabled=false >/dev/null
          helm template rel $chart $common --set loadBalancer.enabled=false --set vergeos.caSecret=my-ca >/dev/null

  chart:
    name: Push chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      CHART: charts/vergeos-cloud-controller-manager
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Tag must be v + chart version and appVersion
        run: |
          for key in version appVersion; do
            v=$(yq eval ".$key" "$CHART/Chart.yaml")
            [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG != v$v (Chart.yaml $key)"; exit 1; }
          done
      - name: Package and push chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package "$CHART" -d "$RUNNER_TEMP"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/vergeos-cloud-controller-manager-${TAG#v}.tgz" oci://ghcr.io/encore-platform-engineering/charts

  package:
    name: Package image
    # chart gates the image push: a tag that does not match Chart.yaml publishes nothing.
    # chart is skipped off-tag; skipped is not failed.
    needs: [check, chart]
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # mode=min keeps the GHA cache small (10 GB repo limit shared with Go caches).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
