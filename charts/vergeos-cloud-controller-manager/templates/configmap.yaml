{{- if .Values.loadBalancer.enabled }}
{{- if not (gt (int .Values.loadBalancer.networkID) 0) }}
{{- fail "loadBalancer.networkID must be > 0 when loadBalancer.enabled=true" }}
{{- end }}
{{- if not .Values.loadBalancer.ipPool }}
{{- fail "loadBalancer.ipPool must list at least one IP when loadBalancer.enabled=true" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  {{- if .Values.vergeos.caBundle }}
  ca.crt: |
    {{- .Values.vergeos.caBundle | nindent 4 }}
  {{- end }}
  cloud-config.json: |
    {
      {{- if or .Values.vergeos.caBundle .Values.vergeos.caSecret }}
      "caFile": "/etc/vergeos/ca.crt",
      {{- end }}
      "nodeNetworkID": {{ .Values.nodeNetworkID | default 0 }},
      "loadBalancer": {
        "enabled": {{ .Values.loadBalancer.enabled }},
        "networkID": {{ .Values.loadBalancer.networkID | default 0 }},
        "ipPool": {{ .Values.loadBalancer.ipPool | default list | toJson }},
        "sourceNATTarget": {{ .Values.loadBalancer.sourceNATTarget | default "" | toJson }},
        "acceptRules": {{ .Values.loadBalancer.acceptRules | default false }},
        "applyStagedChanges": {{ .Values.loadBalancer.applyStagedChanges | default false }}
      }
    }
