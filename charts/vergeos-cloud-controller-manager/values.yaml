image:
  repository: ghcr.io/encore-platform-engineering/vergeos-cloud-controller-manager
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: ghcr-credentials

vergeos:
  host: ""
  apiKey: ""
  verifySSL: "true"
  existingSecret: ""

# Limit node InternalIPs (from NIC DHCP leases) to NICs on this vnet ID; 0 = any.
nodeNetworkID: 0

loadBalancer:
  enabled: true
  networkID: 0
  ipPool: []

replicaCount: 1

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
  - key: node.cloudprovider.kubernetes.io/uninitialized
    value: "true"
    effect: NoSchedule

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
