image:
  repository: ghcr.io/encore-platform-engineering/vergeos-cloud-controller-manager
  # Empty = "v" + Chart.appVersion (CI publishes images on git tags v*).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: ghcr-credentials

vergeos:
  # API host or URL (e.g. 192.0.2.10 or https://vergeos.example.net); https:// is assumed if no scheme.
  host: ""
  apiKey: ""
  verifySSL: "true"
  existingSecret: ""
  # Trust a private CA for the VergeOS API (use with verifySSL "true").
  # caBundle: inline PEM; caSecret: existing Secret with key `ca.crt`. Set at most one.
  # Mounted at /etc/vergeos/ca.crt and wired via caFile in the cloud-config.
  caBundle: ""
  caSecret: ""

# Out-of-cluster mode: run the CCM in a management cluster (e.g. next to a
# k0smotron hosted control plane) so the VergeOS API key never exists in the
# workload (tenant) cluster. The CCM reaches the workload cluster through a
# kubeconfig Secret in the release namespace, e.g. the CAPI/k0smotron
# `<cluster>-kubeconfig` Secret (key `value`).
# When enabled: hostNetwork=false, dnsPolicy=ClusterFirst, no tolerations and no
# mounted ServiceAccount token (hostNetwork, dnsPolicy and tolerations are
# ignored), and no ServiceAccount/ClusterRole/Role is rendered. RBAC is whatever
# the kubeconfig's identity has in the workload cluster.
external:
  enabled: false
  kubeconfigSecret: ""
  kubeconfigSecretKey: value

# Extra command-line arguments for the CCM, e.g. ["--cluster-name=tenant-a"].
# Set a unique --cluster-name per workload cluster when several share one VNet.
extraArgs: []

# Extra container env, volumes and mounts (standard k8s syntax).
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Limit node InternalIPs (from NIC DHCP leases) to NICs on this vnet ID; 0 = any.
nodeNetworkID: 0

# LoadBalancer support is opt-in. When enabled, networkID and a non-empty
# ipPool are required (the chart fails to render without them).
loadBalancer:
  enabled: false
  networkID: 0
  ipPool: []
  # Opt-in rules for clients on the LB vnet or routed from another vnet (see README
  # "Reachability"). sourceNATTarget adds an outgoing translate (SNAT) rule per port
  # with this target (e.g. the vnet's router IP); acceptRules adds an incoming accept
  # rule per port for vnets whose firewall drops unmatched traffic.
  sourceNATTarget: ""
  acceptRules: false
  # Apply the vnet's staged firewall changes even when the CCM changed nothing (recovers
  # from a crash between writing and applying rules, but also activates other people's
  # pending edits on that vnet). Default: only apply after the CCM's own changes.
  applyStagedChanges: false

replicaCount: 1

# CCM must reach the API server and initialize nodes before the CNI is up.
hostNetwork: true
# "Default" = node resolv.conf: CoreDNS is not up until nodes are initialized
# (worker-only clusters). Use ClusterFirstWithHostNet only if you need in-cluster DNS names.
dnsPolicy: Default

# Secure-serving port (/healthz, /metrics). With hostNetwork this is a host port.
securePort: 10258

priorityClassName: system-cluster-critical

# No nodeSelector by default: works on kubeadm/RKE2 control planes and on
# worker-only clusters (hosted control plane, e.g. k0smotron).
nodeSelector: {}

# Overrides the default (preferred pod anti-affinity across nodes when replicaCount > 1).
affinity: {}

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
  - key: node-role.kubernetes.io/master
    operator: Exists
  - key: node.cloudprovider.kubernetes.io/uninitialized
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 300
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 300

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
