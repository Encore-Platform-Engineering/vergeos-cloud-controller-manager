questions:
  - variable: vergeos.host
    label: VergeOS Host URL
    description: "Host or URL (e.g. 192.0.2.10 or https://vergeos.example.net); https:// is assumed when no scheme is given"
    type: string
    required: true
    group: "VergeOS Connection"

  - variable: vergeos.apiKey
    label: API Key
    description: "VergeOS API key for authentication"
    type: password
    required: true
    group: "VergeOS Connection"

  - variable: vergeos.verifySSL
    label: Verify SSL
    description: "Verify SSL certificates for VergeOS API"
    type: enum
    default: "false"
    options:
      - "true"
      - "false"
    group: "VergeOS Connection"

  - variable: vergeos.existingSecret
    label: Existing Secret
    description: "Name of an existing Secret with VergeOS credentials (overrides above fields)"
    type: string
    group: "VergeOS Connection"

  - variable: loadBalancer.enabled
    label: Enable Load Balancer
    description: "Enable LoadBalancer service support via VergeOS VNet rules"
    type: boolean
    default: false
    group: "Load Balancer"
    show_subquestion_if: true
    subquestions:
      - variable: loadBalancer.networkID
        label: VNet Network ID
        description: "VergeOS VNet network ID for load balancer rule creation"
        type: int
        required: true
        default: 0
      - variable: loadBalancer.ipPool
        label: IP Pool
        description: "Comma-separated list of IPs available for LoadBalancer allocation (e.g. 10.0.0.100,10.0.0.101)"
        type: string
      - variable: loadBalancer.sourceNATTarget
        label: Source NAT Target
        description: "Optional: add an outgoing translate (SNAT) rule per Service port with this target (e.g. the vnet router IP) so same-vnet and routed clients get replies back through the LB vnet. Empty = off"
        type: string
      - variable: loadBalancer.acceptRules
        label: Add Accept Rules
        description: "Optional: add an incoming accept rule per Service port for vnets whose firewall drops traffic no rule accepts"
        type: boolean
        default: false

  - variable: imagePullSecrets[0].name
    label: Image Pull Secret
    description: "Name of an existing docker-registry secret for pulling images from GHCR (leave empty if public)"
    type: string
    group: "Advanced"

  - variable: image.tag
    label: Image Tag
    description: "Container image tag (empty = v<chart appVersion>)"
    type: string
    default: ""
    group: "Advanced"

  - variable: replicaCount
    label: Replica Count
    description: "Number of CCM replicas (only one will be leader)"
    type: int
    default: 1
    group: "Advanced"
